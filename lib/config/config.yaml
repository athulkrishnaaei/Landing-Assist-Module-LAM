ros__parameters:
  pcd_file_path: "/home/airsim_user/Landing-Assist-Module-LAM/test.pcd"
  voxel_size: 0.45
  voxel_downsample_pointcloud: true
  visualize: true


  # Define the pipeline of processing steps.
  pipeline:
    - step: "SOR"
      enabled: true
      parameters:
        nb_neighbors: 15
        std_ratio: 0.3
        visualization: "both"
    - step: "Radial"
      enabled: false
      parameters:
        voxel_size: 0.05
        radius_search: 0.9
        min_neighbors: 50
        visualization: "both"
    - step: "Bilateral"
      enabled: false
      parameters:
        voxel_size: 0.05
        sigma_s: 15
        sigma_r: 0.3
        visualization: "both"
    - step: "PROSAC"
      enabled: true
      parameters:
        voxel_size: 0.05
        distanceThreshold: 1.9
        maxIterations: 200
        visualization: "both"
    - step: "RANSAC"
      enabled: true
      parameters:
        voxel_size: 0.05
        distanceThreshold: 1.9
        maxIterations: 200
        visualization: "both"
    - step: "LMEDS"
      enabled: true
      parameters:
        voxel_size: 0.05
        distanceThreshold: 1.9
        maxIterations: 200
        visualization: "both"
    - step: "PCA"
      enabled: true
      parameters:
        voxelSize: 0.1
        angleThreshold: 15
        k: 20
        visualization: "both"
    - step: "HazarMetrices"
      enabled: true
      parameters:
        hazard: "ALL"  #ALL for calculing whole hazard metrices, 
                       #DATA_CONFIDENCE ,only caluculates data confidence individually
  
